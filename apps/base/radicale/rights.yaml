apiVersion: v1
kind: ConfigMap
metadata:
  name: radicale-rights
  namespace: radicale
data:
  rights: |
    [root]
    user: .+
    collection:
    permissions: R

    [owner]
    user: .+
    collection: {user}(/.*)?
    permissions: rRwW

    [hermes-mike]
    user: hermes
    collection: mike(/.*)?
    permissions: rRwW
