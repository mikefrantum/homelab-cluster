apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookshelf
  template:
    metadata:
      labels:
        app: bookshelf

    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000

      containers:
        - name: bookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.37.1

          envFrom:
            - configMapRef:
                name: bookshelf-configmap

          env:
            - name: PODCAST_DOWNLOAD_TIMEOUT
              value: "120000"        # 2 minutes, in ms
            - name: MAX_FAILED_EPISODE_CHECKS
              value: "100"

          ports:
            - containerPort: 3005
              protocol: TCP

          volumeMounts:
            - mountPath: /config
              name: bookshelf-config
            - mountPath: /metadata
              name: bookshelf-metadata
            - mountPath: /audiobooks
              name: bookshelf-audiobooks
            - mountPath: /podcasts
              name: bookshelf-podcasts

      volumes:
        - name: bookshelf-audiobooks
          nfs:
            server: 10.10.10.14
            path: /mnt/media/AudioBooks
        - name: bookshelf-podcasts
          nfs:
            server: 10.10.10.14
            path: /mnt/media/Podcasts
        - name: bookshelf-config
          persistentVolumeClaim:
            claimName: bookshelf-config-lh
        - name: bookshelf-metadata
          persistentVolumeClaim:
            claimName: bookshelf-metadata-lh
