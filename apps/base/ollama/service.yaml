# Cluster-internal only -- no ingress/tunnel. Ollama has no auth.
# Scriberr reaches it at http://ollama.ollama.svc.cluster.local:11434
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
