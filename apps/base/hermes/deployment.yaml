apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        policy-type: app
    spec:
      securityContext:
        fsGroup: 100
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: hermes
          image: forgejo.nohermosa.com/mike/hermes-agent:v2026.9.24-clis1
          args: ["gateway", "run"]
          env:
            - name: TZ
              value: America/Denver
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_SHARED_AUTH_DIR
              value: /opt/data/shared-auth
            - name: DISABLE_AUTOUPDATER
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 6Gi
          volumeMounts:
            - name: state
              mountPath: /opt/data
            - name: shared
              mountPath: /opt/shared
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: hermes-state-lh
        - name: shared
          persistentVolumeClaim:
            claimName: hermes-shared
