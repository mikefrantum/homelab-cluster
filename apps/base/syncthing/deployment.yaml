apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: syncthing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      # Pinned to server0, where the data disks live. hostPath gives local I/O
      # and working inotify file watching (which doesn't work over NFS).
      nodeSelector:
        kubernetes.io/hostname: server0
      containers:
        - name: syncthing
          image: lscr.io/linuxserver/syncthing:2.1.5
          env:
            # 99:100 (nobody:users) matches ownership on server0's disks
            - name: PUID
              value: "99"
            - name: PGID
              value: "100"
            - name: TZ
              value: "America/Denver"
          ports:
            - name: gui
              containerPort: 8384
            - name: sync-tcp
              containerPort: 22000
              protocol: TCP
            - name: sync-udp
              containerPort: 22000
              protocol: UDP
            - name: discovery
              containerPort: 21027
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8384
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            # Add folders in the Syncthing UI by path under /data, e.g.
            #   /data/media/Movies
            #   /data/k8s-volumes/client-files
            #   /data/k8s-volumes/hermes-hermes-shared
            - name: media
              mountPath: /data/media
            - name: k8s-volumes
              mountPath: /data/k8s-volumes
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: syncthing-config
        - name: media
          hostPath:
            path: /mnt/media
            type: Directory
        - name: k8s-volumes
          hostPath:
            path: /mnt/k8s-volumes
            type: Directory
