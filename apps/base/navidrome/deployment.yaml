apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
  labels:
    app.kubernetes.io/name: navidrome
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume — avoid two pods fighting over it during rollouts
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: navidrome
          image: deluan/navidrome:0.64.2 # Renovate will bump this
          ports:
            - name: http
              containerPort: 4533
          env:
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_SCANNER_SCHEDULE
              value: "@every 30m"
            - name: ND_SCANNER_WATCHERWAIT
              value: "5s"
            - name: ND_LOGLEVEL
              value: info
            - name: ND_SESSIONTIMEOUT
              value: 168h
            - name: ND_ENABLESHARING
              value: "true"
            - name: ND_DEFAULTREPORTREALPATH
              value: "false"
            - name: TZ
              value: America/Denver
            - name: ND_LASTFM_ENABLED
              value: "true"
            - name: ND_LASTFM_APIKEY
              valueFrom:
                secretKeyRef: { name: navidrome-lastfm, key: apikey }
            - name: ND_LASTFM_SECRET
              valueFrom:
                secretKeyRef: { name: navidrome-lastfm, key: secret }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 4533
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi # first full scan of a big library can spike
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          nfs:
            server: 10.10.10.14
            path: /mnt/media/MUSIC
            readOnly: true
