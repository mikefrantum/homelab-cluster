apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      initContainers:
        - name: sysctls
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              sysctl -w net.ipv4.conf.all.src_valid_mark=1
      containers:
        # --- Gluetun VPN sidecar ---
        - name: gluetun
          image: qmcgaw/gluetun:v3.40.0
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "protonvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-secret
                  key: WIREGUARD_PRIVATE_KEY
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: gluetun-secret
                  key: WIREGUARD_ADDRESSES
            - name: WIREGUARD_PUBLIC_KEY
              value: "4PtkYaXbBabB3UgB6KHUtaBvJrggreOOXfmhKKUfEg0="
            - name: WIREGUARD_ENDPOINT_IP
              value: "198.44.139.75"
            - name: WIREGUARD_ENDPOINT_PORT
              value: "51820"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16"
            - name: TZ
              value: "America/Denver"
          ports:
            - containerPort: 8888
              protocol: TCP
              name: http-proxy
            - containerPort: 8080
              protocol: TCP
              name: sabnzbd

        # --- SABnzbd ---
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:4.5.1
          env:
            - name: PUID
              value: "99"
            - name: PGID
              value: "100"
            - name: TZ
              value: "America/Denver"
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: media
              mountPath: /media

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: downloads
          nfs:
            server: 10.10.10.10
            path: /mnt/user/Media/_DOWNLOADS
        - name: media
          nfs:
            server: 10.10.10.10
            path: /mnt/user/Media
