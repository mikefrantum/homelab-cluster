apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      nodeSelector:
        kubernetes.io/hostname: server2
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      initContainers:
        - name: sysctls
          image: busybox:1.38
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              sysctl -w net.ipv4.conf.all.src_valid_mark=1
      containers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_INTERFACE
              value: "wg0"
            - name: BLOCK_IPV6
              value: "on"
            - name: DNS_UPSTREAM_IPV6
              value: "off"
            - name: DNS_SERVER
              value: "on"
            - name: DNS_ADDRESS
              value: "1.1.1.1"
            - name: HEALTH_TARGET_ADDRESS
              value: "1.1.1.1:443"
            - name: VPN_SERVICE_PROVIDER
              value: "protonvpn"
            - name: VPN_TYPE
              value: "wireguard"
            - name: BLOCK_MALICIOUS
              value: "off"
            - name: BLOCK_SURVEILLANCE
              value: "off"
            - name: BLOCK_ADS
              value: "off"
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-secret
                  key: WIREGUARD_PRIVATE_KEY
            - name: WIREGUARD_ADDRESSES
              valueFrom:
                secretKeyRef:
                  name: gluetun-secret
                  key: WIREGUARD_ADDRESSES
            - name: WIREGUARD_MTU
              value: "1280"
            - name: SERVER_COUNTRIES
              value: "United States"
            - name: SERVER_CITIES
              value: "Seattle"
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.42.0.0/16,10.43.0.0/16"
            - name: TZ
              value: "America/Denver"
          ports:
            - containerPort: 8080
              protocol: TCP
              name: sabnzbd
          livenessProbe:
            exec:
              command:
                - wget
                - -qO-
                - http://127.0.0.1:9999
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:5.1.3
          env:
            - name: PUID
              value: "99"
            - name: PGID
              value: "100"
            - name: TZ
              value: "America/Denver"
            - name: HOST_WHITELIST_ENTRIES
              value: "sabnzb.nohermosa.com,sabnzbd.lab.nohermosa.com"
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: downloads
          nfs:
            server: 10.10.10.10
            path: /mnt/user/Media/_DOWNLOADS
        - name: media
          nfs:
            server: 10.10.10.10
            path: /mnt/user/Media
