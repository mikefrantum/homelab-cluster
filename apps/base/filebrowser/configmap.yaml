apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
  namespace: filebrowser
data:
  config.yaml: |
    server:
      database: /home/filebrowser/data/database.db
      cacheDir: /cache
      sources:
        - path: /folder
          config:
            defaultEnabled: true
    auth:
      tokenExpirationHours: 720   # 30 days; whole number of hours
