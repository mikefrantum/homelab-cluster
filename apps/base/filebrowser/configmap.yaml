apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
  namespace: filebrowser
data:
  config.yaml: |
    server:
      database:
        path: /home/filebrowser/data/filebrowser.sqlite
        migrateFrom: /home/filebrowser/data/database.db.old
      cacheDir: /cache
      sources:
        - path: /folder
          config:
            defaultEnabled: true
    http:
      trustProxyHeaders: true
    auth:
      tokenExpirationHours: 720
