apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless
spec:
  # Documents on server0 NFS, pinned to the existing volume.
  accessModes:
    - ReadWriteOnce
  storageClassName: unraid-nfs
  volumeName: pvc-1092f69f-75b6-4a5c-b359-17114030b14f
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
