apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guacamole-postgres-data
  namespace: guacamole
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-postgres
  namespace: guacamole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: guacamole-postgres
  template:
    metadata:
      labels:
        app: guacamole-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_DB
              value: "guacamole_db"
            - name: POSTGRES_USER
              value: "guacamole_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guacamole-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: guacamole-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole-postgres
  namespace: guacamole
spec:
  selector:
    app: guacamole-postgres
  ports:
    - port: 5432
      targetPort: 5432
