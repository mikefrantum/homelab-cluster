apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krusader
  namespace: media-tools
spec:
  ingressClassName: traefik   # k3s default; change if you run a different controller
  rules:
    - host: kru.lab.nohermosa.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: krusader
                port:
                  name: web
