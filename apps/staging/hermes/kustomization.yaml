apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - ../../base/hermes/
  - vikunja-secret.enc.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hermes
        namespace: hermes
      spec:
        template:
          spec:
            containers:
              - name: hermes
                envFrom:
                  - secretRef:
                      name: vikunja-credentials

