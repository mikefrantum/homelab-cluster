apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - ../../base/hermes/
  - vikunja-secret.enc.yaml
  - claude-oauth.enc.yaml
  - forgejo-registry.enc.yaml
  - vault-git.enc.yaml
  - dashboard-secret.yaml
  - ingress.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hermes
        namespace: hermes
      spec:
        template:
          spec:
            containers:
              - name: hermes
                envFrom:
                  - secretRef:
                      name: vikunja-credentials
                  - secretRef:
                      name: claude-oauth
                  - secretRef:
                      name: vault-git
              - name: hermes-serve
                envFrom:
                  - secretRef:
                      name: vikunja-credentials
                  - secretRef:
                      name: claude-oauth
                  - secretRef:
                      name: vault-git
                  - secretRef:
                      name: hermes-dashboard-auth
