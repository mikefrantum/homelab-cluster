apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 4get
  namespace: 4get
spec:
  ingressClassName: traefik
  rules:
    - host: 4get.lab.nohermosa.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 4get
                port:
                  name: http
