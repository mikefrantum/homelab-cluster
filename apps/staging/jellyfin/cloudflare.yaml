apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-jellyfin
  namespace: jellyfin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-jellyfin
  template:
    metadata:
      labels:
        app: cloudflared-jellyfin
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.2
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: jellyfin-tunnel-credentials
        - name: config
          configMap:
            name: cloudflared-jellyfin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-jellyfin
  namespace: jellyfin
data:
  config.yaml: |
    tunnel: jellyfin
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: jellyfin.nohermosa.com
        service: http://jellyfin-web.jellyfin.svc.cluster.local:8096
      - service: http_status:404
