apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-guacamole
  namespace: guacamole
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-guacamole
  template:
    metadata:
      labels:
        app: cloudflared-guacamole
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: guacamole-tunnel-credentials
        - name: config
          configMap:
            name: cloudflared-guacamole
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-guacamole
  namespace: guacamole
data:
  config.yaml: |
    tunnel: remote
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: remote.nohermosa.com
        service: http://guacamole-web.guacamole.svc.cluster.local:8080
      - service: http_status:404
