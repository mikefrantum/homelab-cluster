apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-filebrowser
  namespace: filebrowser
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-filebrowser
  template:
    metadata:
      labels:
        app: cloudflared-filebrowser
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.0
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: filebrowser-tunnel-credentials
        - name: config
          configMap:
            name: cloudflared-filebrowser
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-filebrowser
  namespace: filebrowser
data:
  config.yaml: |
    tunnel: filebrowser
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: filebrowser.zoomzoom.design
        service: http://filebrowser.filebrowser.svc.cluster.local:80
      - service: http_status:404
