apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-vikunja
  namespace: vikunja
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-vikunja
  template:
    metadata:
      labels:
        app: cloudflared-vikunja
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: vikunja-tunnel-credentials
        - name: config
          configMap:
            name: cloudflared-vikunja
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-vikunja
  namespace: vikunja
data:
  config.yaml: |
    tunnel: tasks 
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: tasks.nohermosa.com
        service: http://vikunja.vikunja.svc.cluster.local:3456
      - service: http_status:404
