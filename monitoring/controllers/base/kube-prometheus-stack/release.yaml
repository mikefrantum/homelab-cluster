apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.x"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      grafana.ini:
        server:
          root_url: https://grafana.lab.nohermosa.com
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.lab.nohermosa.com
      persistence:
        enabled: true
        type: pvc
        storageClassName: longhorn
        accessModes: ["ReadWriteOnce"]
        size: 2Gi
      deploymentStrategy:
        type: Recreate

    prometheus:
      prometheusSpec:
        retention: 30d
        retentionSize: 18GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
    alertmanager:
      templateFiles:
        telegram.tmpl: |-
          {{ define "telegram.message" }}
          {{- range .Alerts }}
          {{ if eq .Status "firing" }}{{ if eq .Labels.severity "critical" }}🔴{{ else }}🟠{{ end }}{{ else }}✅{{ end }} <b>{{ .Labels.alertname }}</b>{{ if .Labels.namespace }} · {{ .Labels.namespace }}{{ end }}
          {{ .Annotations.summary | html }}
          {{- if and (eq .Status "firing") .Annotations.description }}
          <i>{{ .Annotations.description | html }}</i>
          {{- end }}
          {{- if and (eq .Status "firing") .Annotations.runbook_url }}
          <a href="{{ .Annotations.runbook_url }}">runbook</a>
          {{- end }}
          {{ end }}
          {{- end }}
      alertmanagerSpec:
        secrets:
          - alertmanager-telegram
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
      config:
        templates:
          - /etc/alertmanager/config/*.tmpl
        global:
          resolve_timeout: 5m
        route:
          receiver: telegram
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor|KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
        inhibit_rules:
          - source_matchers: [severity = "critical"]
            target_matchers: [severity = "warning"]
            equal: [alertname, namespace]
        receivers:
          - name: "null"
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                chat_id: 8206889204
                send_resolved: true
                parse_mode: HTML
                message: '{{ template "telegram.message" . }}'
