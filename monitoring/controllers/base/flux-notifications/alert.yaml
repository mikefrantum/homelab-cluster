apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: flux-failures
  namespace: flux-system
spec:
  providerRef:
    name: telegram
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: Kustomization
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: HelmRepository
      name: "*"
      namespace: monitoring
    - kind: HelmRelease
      name: "*"
      namespace: cnpg-system
    - kind: HelmRelease
      name: "*"
      namespace: immich
    - kind: HelmRelease
      name: "*"
      namespace: longhorn-system
    - kind: HelmRelease
      name: "*"
      namespace: mariadb
    - kind: HelmRelease
      name: "*"
      namespace: monitoring
